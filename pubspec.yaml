name: grand_public_v2
description: "100% emotion"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  shared_preferences: ^2.5.3
  flutter_otp_text_field: ^1.5.1+1
  get_storage: ^2.1.1
  dio: ^5.9.0
  fluttertoast: ^9.0.0
  url_launcher: ^6.3.2
  feexpay_flutter: ^1.0.12
  carousel_slider: ^5.1.1
  youtube_player_flutter: ^9.1.3
  pusher_channels_flutter: ^2.5.0
  timeago: ^3.7.1
  uuid: ^4.5.2
  kkiapay_flutter_sdk: ^1.3.4
  flutter_launcher_icons: ^0.14.4
  country_pickers: ^3.0.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.6
  http: ^1.6.0
  firebase_core: ^4.5.0
  firebase_messaging: ^16.1.2
  flutter_local_notifications: ^21.0.0
  googleapis_auth: ^2.0.0
  firebase_auth: ^6.2.0
  image_picker: ^1.2.1
  video_player: ^2.11.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  # ── Social additions ──────────────────────────────────────────────────────
  file_picker: ^8.3.7          # Sélection fichiers génériques (PDF, doc…)
  record: ^5.2.0               # Enregistrement audio
  audioplayers: ^6.4.0         # Lecture audio messages vocaux
  just_the_tooltip: ^0.0.12    # (optionnel – tooltips)
  open_filex: ^4.7.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/test/

  fonts:
    - family: gotham
      fonts:
        - asset: assets/fonts/gotham_black.otf
        - asset: assets/fonts/gotham_blackitalic.otf
          style: italic

    - family: gotham_light
      fonts:
        - asset: assets/fonts/gotham_light.otf
        - asset: assets/fonts/gotham_lightitalic.otf
          style: italic

    - family: gotham_book
      fonts:
        - asset: assets/fonts/gotham_book.otf
        - asset: assets/fonts/gotham_bookitalic.otf
          style: italic

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/logo.png"  # ← mettez le bon chemin de votre logo
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"  # ← couleur de fond pour Android 8+
  adaptive_icon_foreground: "assets/icons/logo.png"

dependency_overrides:
  record_linux: ^1.0.0
  record_platform_interface: ^1.5.0