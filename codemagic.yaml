workflows:

  android-workflow:
    name: Android Release (AAB)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      java: "17"

    scripts:
      - name: Installer les dépendances
        script: flutter pub get

      - name: Générer les icônes launcher
        script: dart run flutter_launcher_icons

      - name: Build AAB release
        script: |
          flutter build appbundle --release \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - build/app/outputs/mapping/release/mapping.txt

    publishing:
      email:
        recipients:
          - abdulmoustapha64@gmail.com
        notify:
          success: true
          failure: true


  ios-workflow:
    name: iOS Release (IPA)

    integrations:
      app_store_connect: Grand Public API Key

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Clean Flutter
        script: flutter clean

      - name: Install dependencies
        script: flutter pub get

      - name: Generate icons
        script: dart run flutter_launcher_icons

      - name: Remove LaunchImage (fix Apple rejection)
        script: rm -rf ios/Runner/Assets.xcassets/LaunchImage.imageset

      - name: Install pods
        script: cd ios && pod install

      - name: Setup code signing
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal

      email:
        recipients:
          - abdulmoustapha64@gmail.com
        notify:
          success: true
          failure: true