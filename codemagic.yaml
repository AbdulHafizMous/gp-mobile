workflows:

  # ══════════════════════════════════════════════════════════════════
  # ANDROID — App Bundle (.aab)
  # ══════════════════════════════════════════════════════════════════
  android-workflow:
    name: Android Release (AAB)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      java: "17"

    scripts:
      - name: Installer les dépendances
        script: flutter pub get

      - name: Générer les icônes launcher
        script: dart run flutter_launcher_icons

      - name: Build AAB release
        script: |
          flutter build appbundle --release \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - build/app/outputs/mapping/release/mapping.txt

    publishing:
      email:
        recipients:
          - abdulmoustapha64@gmail.com
        notify:
          success: true
          failure: true


  # ══════════════════════════════════════════════════════════════════
  # iOS — IPA signé (DEV OK)
  # ══════════════════════════════════════════════════════════════════
  ios-workflow:
    name: iOS Release (IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Grand Public API Key

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      # ⚠️ MODE MANUEL (OBLIGATOIRE DANS TON CAS)
      # ios_signing:
      #   certificates:
      #     - "distribution"   # ← remplace par le nom exact Codemagic
      #   provisioning_profiles:
      #     - "Grand Public Bénin Prod Provisioning Profile"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.maxafrica.gpbenin

    scripts:
      - name: Installer les dépendances Flutter
        script: flutter pub get

      - name: Générer les icônes launcher
        script: dart run flutter_launcher_icons

      - name: Installer les pods iOS
        script: |
          cd ios && pod install

      - name: Setup iOS code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA signé
        script: |
          flutter build ipa \
            --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration

        submit_to_testflight: true

        beta_groups:
          - Internal

      email:
        recipients:
          - abdulmoustapha64@gmail.com
        notify:
          success: true
          failure: true