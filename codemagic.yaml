workflows:

  # ══════════════════════════════════════════════════════════════════
  # ANDROID — App Bundle (.aab) pour Google Play
  # ══════════════════════════════════════════════════════════════════
  android-workflow:
    name: Android Release (AAB)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      java: "17"

    scripts:
      - name: Installer les dépendances
        script: flutter pub get

      - name: Générer les icônes launcher
        script: dart run flutter_launcher_icons

      - name: Build AAB release
        script: |
          flutter build appbundle --release \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - build/app/outputs/mapping/release/mapping.txt

    # publishing:
    #   email:
    #     recipients:
    #       - votre@email.com
    #     notify:
    #       success: true
    #       failure: true


  # ══════════════════════════════════════════════════════════════════
  # iOS — IPA non signé à uploader manuellement
  # ══════════════════════════════════════════════════════════════════
  ios-workflow:
    name: iOS Release (IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Installer les dépendances Flutter
        script: flutter pub get

      - name: Générer les icônes launcher
        script: dart run flutter_launcher_icons

      - name: Installer les pods iOS
        script: |
          cd ios && pod install

      - name: Build IPA sans signature
        script: |
          flutter build ipa --release \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER \
            --no-codesign

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    # publishing:
    #   email:
    #     recipients:
    #       - votre@email.com
    #     notify:
    #       success: true
    #       failure: true